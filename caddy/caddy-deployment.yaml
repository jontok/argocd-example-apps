apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: default
  labels:
    app: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: caddy
        image: caddy:latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: default
data:
  Caddyfile: |
    :80 {
        root * /usr/share/caddy
        file_server
        try_files {path} {path}/ /index.html
    }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-service
  namespace: default
spec:
  selector:
    app: caddy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
